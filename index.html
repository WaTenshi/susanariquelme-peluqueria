    <style>
      #app-boot-screen {
        position: fixed;
        z-index: 1000;
        inset: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        align-items: end;
        padding: clamp(2rem, 7vw, 5rem);
        color: #fff;
        background:
          linear-gradient(90deg, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.24)),
          linear-gradient(0deg, rgba(0, 0, 0, 0.64), transparent 58%),
          #101413 url('/og-salon.jpg') center / cover no-repeat;
        font-family: Arial, sans-serif;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 520ms ease,
          visibility 0s linear 520ms;
      }

      #app-boot-screen > div {
        width: min(46rem, 100%);
      }

      #app-boot-screen p {
        margin: 0 0 0.9rem;
        color: #ead8c8;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #app-boot-screen strong {
        display: block;
        max-width: 12ch;
        font: 500 clamp(3rem, 9vw, 6rem) / 0.92 Georgia, serif;
      }

      .app-boot-progress {
        width: min(14rem, 65vw);
        height: 2px;
        margin-top: 1.8rem;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.24);
      }

      .app-boot-progress::after {
        content: '';
        display: block;
        width: 42%;
        height: 100%;
        background: #ead8c8;
        animation: app-boot-progress 1.1s ease-in-out infinite alternate;
      }

      .app-boot-status {
        display: block;
        margin-top: 0.8rem;
        color: rgba(255, 255, 255, 0.74);
        font-size: 0.72rem;
        letter-spacing: 0.04em;
      }

      html.app-loading {
        overflow: hidden;
      }

      html.app-ready #app-boot-screen {
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
      }

      .app-boot-recovery {
        display: none;
      }

      .seo-prerender-shell {
        display: none;
      }

      html.app-boot-failed #app-boot-screen {
        position: relative;
        z-index: auto;
        inset: auto;
        min-height: auto;
        display: block;
        padding: 1rem;
        color: #201a16;
        background: #f7f3ee;
      }

      html.app-boot-failed .app-boot-loading {
        display: none;
      }

      html.app-boot-failed .app-boot-recovery {
        display: flex;
        width: min(70rem, 100%);
        margin: 0 auto;
        padding: 0.9rem 1rem;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        color: #fff;
        background: #172724;
        border-radius: 0.75rem;
      }

      html.app-boot-failed .app-boot-recovery p {
        margin: 0;
        color: inherit;
        font-size: 0.85rem;
        letter-spacing: 0;
        text-transform: none;
      }

      html.app-boot-failed .app-boot-recovery button {
        flex: none;
        padding: 0.65rem 0.9rem;
        color: #172724;
        background: #ead8c8;
        border: 0;
        border-radius: 999px;
        font: 600 0.78rem Arial, sans-serif;
        cursor: pointer;
      }

      html.app-boot-failed .seo-prerender-shell {
        display: block;
      }

      @keyframes app-boot-progress {
        from { transform: translateX(-10%); }
        to { transform: translateX(150%); }
      }

      @media (max-width: 560px) {
        html.app-boot-failed .app-boot-recovery {
          align-items: flex-start;
          flex-direction: column;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-progress::after { animation: none; }
        #app-boot-screen { transition: none; }
      }
    </style>
    <script>
      (function () {
        var pageLoaded = document.readyState === 'complete'
        var appMounted = false
        var fontsLoaded = !document.fonts
        var minimumElapsed = false
        var finished = false

        document.documentElement.classList.add('app-loading')

        var revealApp = function () {
          if (finished) return
          finished = true
          document.documentElement.classList.remove('app-loading', 'app-boot-failed')
          document.documentElement.classList.add('app-ready')

          window.setTimeout(function () {
            var screen = document.getElementById('app-boot-screen')
            if (screen) screen.setAttribute('aria-hidden', 'true')
          }, 550)
        }

        var revealWhenReady = function () {
          if (appMounted && pageLoaded && fontsLoaded && minimumElapsed) revealApp()
        }

        var showBootFailure = function () {
          if (finished) return
          document.documentElement.classList.remove('app-loading')
          document.documentElement.classList.add('app-boot-failed')
        }

        window.addEventListener('sr-app-mounted', function () {
          appMounted = true
          revealWhenReady()
        })

        window.addEventListener('load', function () {
          pageLoaded = true
          revealWhenReady()
        }, { once: true })

        if (document.fonts) {
          document.fonts.ready.then(function () {
            fontsLoaded = true
            revealWhenReady()
          }, function () {
            fontsLoaded = true
            revealWhenReady()
          })
        }

        window.setTimeout(function () {
          minimumElapsed = true
          revealWhenReady()
        }, 900)

        window.setTimeout(function () {
          if (appMounted) revealApp()
          else showBootFailure()
        }, 8000)

        window.addEventListener('error', function (event) {
          var target = event.target
          if (target === window || (target && target.tagName === 'SCRIPT')) {
            window.setTimeout(showBootFailure, 0)
          }
        }, true)
      })()
    </script>
